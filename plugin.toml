[plugin]
id = "mcbot_bridge"
name = "MCBot 同伴桥接"
description = "桥接本地 mcbot（Fabric 假人同伴），让猫娘可以指挥同伴做事、替同伴向你转达问题，并实时转播同伴的进展。"
short_description = "Bridge a local mcbot companion (REST + SSE) so neko-chan can direct it and relay its progress."
keywords = ["minecraft", "mcbot", "companion"]
version = "0.3.2"
entry = "plugin.plugins.mcbot_bridge:McbotBridgePlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
# 手动启动，避免用户开插件时默认去连一个还没跑起来的 Minecraft 客户端。
auto_start = false

[plugin.ui]
enabled = true

# 交互面板用 [[plugin.ui.panel]]，不要用 [[plugin.ui.guide]]。
# guide / docs 是**只读文档面**：默认只给 state:read，渲染在插件详情页的「指南」标签里。
# surfaces/mcbot.tsx 会通过 props.api.call 调 mcbot_status / mcbot_stop，它是面板。
[[plugin.ui.panel]]
id = "mcbot"
title = "mcbot 同伴"
entry = "surfaces/mcbot.tsx"
# 宿主默认 mode = "static"，会把 entry 当 http 静态资源塞进 iframe 的 src，
# 浏览器请求到的是一段 TSX 文本，页面全白。只有 "hosted-tsx" 才走
# @neko/plugin-ui 的编译器与沙箱。
mode = "hosted-tsx"
# context 对应 @ui.context(id="mcbot")；缺了 api.call 会因 UI context not found 失败。
context = "mcbot"
# action:call 让面板通过 props.api.call 调用 mcbot_status / mcbot_stop。
permissions = ["state:read", "action:call"]

# 教程页：插件详情页的「指南」标签，Markdown 给用户看。
# 面板负责状态/停止，指南负责安装、首次连接、叫停接续和排障。
[[plugin.ui.guide]]
id = "guide"
title = "使用指南"
entry = "docs/guide.md"
permissions = ["state:read"]

[mcbot]
# mcbot 的本地桥（仅在 Minecraft 客户端进入世界时监听）。
base_url = "http://127.0.0.1:17897"

# Minecraft 游戏目录，用于定位 bridge.token。留空则尝试平台默认位置
# （Windows: %APPDATA%/.minecraft）。
game_dir = ""

# 显式指定 token 文件路径；留空则用 <game_dir>/mcbot/bridge.token。
# token 只从文件读，不写进本插件的配置——见 README 的隐私说明。
token_file = ""

# SSE 事件流断开后的重连间隔。
reconnect_interval_seconds = 5.0

# 单次 REST 调用（task/cancel/answer/status）的超时。
http_timeout_seconds = 10.0

# 兼容传输层的 /v1/ask 超时。猫娘的 mcbot_ask 现在只读状态，不创建游戏任务。
ask_timeout_seconds = 150.0

# 首次提示结果仍未知的等待时间。超时保留任务及叫停能力，不释放任务槽、
# 不取消游戏任务、不自动重发。迟到终态仍归原任务；明确叫停后才可重新派活。
task_wait_timeout_seconds = 900.0

# 是否订阅 /v1/events。关掉后同伴的进展、反问和完成都不会主动到达（只剩
# 派活与查询），一般不该关。
stream_events = true

# progress 事件推进 LLM 上下文的最小间隔。mcbot 每执行一步都会发一条
# progress，不设闸会把上下文灌满；同一个 coalesce_key 只会折叠在队列里，
# 落不进已发出的回合。
progress_min_interval_seconds = 6.0

# state 事件（同伴的身体状态变化）推进上下文的最小间隔，同理。
state_min_interval_seconds = 6.0
